version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: white_ai_postgres
    environment:
      POSTGRES_USER: whiteai
      POSTGRES_PASSWORD: whiteai123
      POSTGRES_DB: whiteai_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: white_ai_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
